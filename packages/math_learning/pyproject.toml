[project]
name = "math-learning"
version = "1.0.0"
description = "Packages for learning"
readme = "README.md"
authors = [
    { name = "ramapr25", email = "ppr052582@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
math-learning = "math_learning:main"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests"
]
